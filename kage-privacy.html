<h1>kage 隱私權與使用條款</h1>
<p>kage 是 Dantanini 自用的家庭助理程式，只給本人與家人使用，不對外提供服務。</p>
<h2>隱私權</h2>
<ul>
<li>經本人授權後，只以唯讀方式讀取本人的 Gmail，用來整理每日摘要並私訊給本人。</li>
<li>資料只存放在本人自己的電腦，不分享、不販售，也不用於廣告。</li>
<li>可隨時撤銷授權：Google 帳戶 → 安全性 → 你與第三方應用程式和服務的連結 → 移除 kage。</li>
</ul>
<h2>使用條款</h2>
<p>本程式僅供本人家庭私人使用，不提供任何形式的公開服務或保證。</p>
<p>聯絡：<a href="https://github.com/Dantanini">github.com/Dantanini</a></p>
